name: Build Custom CasparCG

on:
  workflow_dispatch:
  push:
    branches: [casparvc]
    paths: [build-config.yml]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: casparcg

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout config branch
        uses: actions/checkout@v4
        with:
          ref: casparvc
          path: config

      - name: Install yq
        uses: mikefarah/yq@master

      - name: Parse build config
        id: cfg
        run: |
          echo "upstream_repo=$(yq '.upstream.repo' config/build-config.yml)" >> "$GITHUB_OUTPUT"
          echo "upstream_branch=$(yq '.upstream.branch' config/build-config.yml)" >> "$GITHUB_OUTPUT"
          echo "fork_repo=$(yq '.fork.repo' config/build-config.yml)" >> "$GITHUB_OUTPUT"

      - name: Checkout upstream source
        uses: actions/checkout@v4
        with:
          repository: ${{ steps.cfg.outputs.upstream_repo }}
          ref: ${{ steps.cfg.outputs.upstream_branch }}
          path: source
          fetch-depth: 0

      - name: Record upstream commit
        id: upstream
        working-directory: source
        run: |
          SHA=$(git rev-parse HEAD)
          SHORT=$(git rev-parse --short HEAD)
          echo "sha=$SHA"   >> "$GITHUB_OUTPUT"
          echo "short=$SHORT" >> "$GITHUB_OUTPUT"
          echo "Upstream ${{ steps.cfg.outputs.upstream_branch }}: $SHORT ($SHA)"

      - name: Merge enabled feature branches
        working-directory: source
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          git config user.email "ci@build.local"
          git config user.name "CI Build"

          FORK_REPO="${{ steps.cfg.outputs.fork_repo }}"
          git remote add fork "https://x-access-token:${GITHUB_TOKEN}@github.com/${FORK_REPO}.git"
          git fetch fork

          COUNT=$(yq '.features | length' ../config/build-config.yml)
          MERGED=0
          SKIPPED=0

          echo ""
          echo "=== Merging feature branches ==="
          echo ""

          for i in $(seq 0 $((COUNT - 1))); do
            ENABLED=$(yq ".features[$i].enabled" ../config/build-config.yml)
            BRANCH=$(yq ".features[$i].branch"  ../config/build-config.yml)
            NAME=$(yq ".features[$i].name"       ../config/build-config.yml)

            if [ "$ENABLED" != "true" ]; then
              echo "SKIP: $NAME ($BRANCH)"
              SKIPPED=$((SKIPPED + 1))
              continue
            fi

            echo "MERGE: $NAME ($BRANCH)"
            if ! git merge --no-edit "fork/$BRANCH"; then
              echo ""
              echo "CONFLICT merging '$BRANCH'."
              echo "Rebase this branch onto upstream/${{ steps.cfg.outputs.upstream_branch }} and push again."
              git merge --abort
              exit 1
            fi

            echo "  OK: $NAME"
            MERGED=$((MERGED + 1))
          done

          echo ""
          echo "=== Summary ==="
          echo "  Merged:  $MERGED"
          echo "  Skipped: $SKIPPED"

      - name: Lowercase owner name
        id: repo
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: source
          file: source/tools/linux/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ steps.repo.outputs.owner }}/${{ env.IMAGE_NAME }}:upstream-${{ steps.upstream.outputs.short }}
          build-args: |
            GIT_HASH=${{ steps.upstream.outputs.sha }}
          platforms: linux/amd64
