# CasparCG Custom Build Configuration
#
# This file controls which upstream base and feature branches
# are merged into the custom build. Edit 'enabled' to toggle features.
# Push changes to the casparvc branch to trigger a CI build,
# or run ./build.sh to build locally.

upstream:
  repo: CasparCG/server
  branch: master

fork:
  repo: toontoet/casparcg

features:
  - name: FFmpeg Stream Reconnect
    branch: feature/reconnect
    enabled: true
    description: >
      Auto-reconnect streaming consumers (SRT/RTMP) on connection loss
      with stepped exponential backoff.

  - name: StereoTool Audio Processing
    branch: feature/stereotool
    enabled: false
    description: >
      Channel-level audio processing via libStereoTool, controllable
      with MIXER STEREOTOOL command. Includes A/V sync compensation.

  - name: Hardware Encoding (QSV/VAAPI/NVENC)
    branch: feature/hw-encoding-support
    enabled: true
    description: >
      GPU-accelerated video encoding for FFmpeg stream consumers
      using Intel QSV, VAAPI or NVIDIA NVENC (-init_hw_device cuda).

  - name: FFmpeg Consumer -vn/-an Flags
    branch: feat/ffmpeg-consumer-vn-an
    enabled: true
    description: >
      Allow standalone -vn / -an flags in the FFmpeg consumer to
      produce audio-only or video-only output streams (e.g. audio-only
      SRT). Also fixes the argument parser so boolean flags no longer
      swallow the next option as their value.

  - name: Disable Vulkan Accelerator
    branch: feature/no-vulkan
    enabled: true
    description: >
      Remove Vulkan SDK download and build flag from Docker image.
      Keeps the build lean for deployments that only need OpenGL.

  - name: FFmpeg 8.1 with NVENC
    branch: feature/ffmpeg-8.1
    enabled: true
    description: >
      Build FFmpeg 8.1 from source instead of using Ubuntu's 6.1, with
      libx264, libx265, NVIDIA NVENC/NVDEC, VAAPI and QSV. Run the image
      with --gpus all to use h264_nvenc / hevc_nvenc.
      
  - name: shim fix for CEF crash
    branch: cef_shim_fix
    enabled: true
    description: >
      Fixes random crashes of server caused by illegal memory operations by CEF.
      
  - name: Unicode fix for CG UPDATE
    branch: fix/utf8-cg-update
    enabled: false
    description: >
      (MERGED)Prevent AMCP channel crash when CG UPDATE contains
      emoji or other non-ASCII Unicode characters. 

# Files that exist locally but are not stored in git (proprietary binaries).
# The build script copies these into the Docker build context automatically.
local_files:
  - test/libStereoTool_1075/lib/Linux/IntelAMD/64/libStereoTool_intel64.so
